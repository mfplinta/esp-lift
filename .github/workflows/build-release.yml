name: Build and Release

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IDF_DOCKER_TAG: v5.5.2

jobs:
  version:
    runs-on: ubuntu-latest
    name: Version

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Generate version
        id: version
        run: echo "version=$(date -u +'%Y%m%d.%H%M%S')" >> "$GITHUB_OUTPUT"

  image:
    runs-on: ubuntu-latest
    name: ESP-IDF image

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - uses: actions/checkout@v5

      - name: Set image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="${OWNER,,}"
          echo "image=ghcr.io/${owner}/esp-lift-idf:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ESP-IDF image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          build-args: DOCKER_TAG=${{ env.IDF_DOCKER_TAG }}
          tags: ${{ steps.image.outputs.image }}
          push: true
          cache-from: type=gha,scope=esp-idf-image
          cache-to: type=gha,scope=esp-idf-image,mode=max

  build:
    runs-on: ubuntu-latest
    name: Build ${{ matrix.target }} ${{ matrix.flash_size }}
    needs:
      - version
      - image

    strategy:
      fail-fast: false
      matrix:
        target:
          - esp32
          - esp32s3
        flash_size:
          - 2mb
          - 4mb

    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build firmware
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e IDF_GIT_SAFE_DIR=/workspace \
            -e IDF_TARGET=${{ matrix.target }} \
            -e FLASH_SIZE=${{ matrix.flash_size }} \
            ${{ needs.image.outputs.image }} \
            ./scripts/ci-build-firmware.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ needs.version.outputs.version }}-${{ matrix.target }}-${{ matrix.flash_size }}
          path: build/out/${{ matrix.target }}-${{ matrix.flash_size }}.bin
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    name: Release
    needs:
      - version
      - build
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-${{ needs.version.outputs.version }}-*
          path: firmware
          merge-multiple: true

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ needs.version.outputs.version }}
          name: Firmware ${{ needs.version.outputs.version }}
          artifacts: "firmware/*.bin"
          generateReleaseNotes: true
